name: Deploy API to Digital Ocean

on:
  push:
    branches:
      - master
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Digital Ocean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_WEB_HOST }}
          username: deploy
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            cd /var/www/singularity
            # Ensure swap exists to prevent OOM during npm install
            if [ ! -f /swapfile ]; then
              echo "Creating 2GB swap file..."
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
            fi
            sudo chown -R deploy:deploy .git
            git fetch origin master
            git reset --hard origin/master
            echo "Deployed commit: $(git rev-parse HEAD)"
            echo "Admin routes file exists: $(test -f apps/api/src/routes/admin.ts && echo 'yes' || echo 'no')"
            sudo chown -R deploy:deploy /var/www/singularity
            sudo mkdir -p /var/log/pm2
            sudo chown -R deploy:deploy /var/log/pm2

            # Stop the API BEFORE building so crash-looping processes
            # don't eat the droplet's memory during tsc compilation.
            pm2 delete singularity-api || true
            sudo fuser -k 3002/tcp 2>/dev/null || true

            sudo rm -rf apps/api/dist
            # Same npm optional-deps bug as the web deploy: git reset
            # restores the Mac-generated lockfile, and npm install then
            # prunes Linux-specific optional deps (sharp, rollup,
            # esbuild). Remove the lockfile so npm regenerates it fresh
            # on Linux with the correct platform binaries.
            rm -f package-lock.json
            rm -rf node_modules packages/shared-types/node_modules packages/shared-api/node_modules
            NODE_OPTIONS="--max-old-space-size=512" npm install

            # Rebuild workspace packages so the API's tsc can resolve
            # types from @singularity/shared-types and shared-api.
            # dist/ is gitignored so it must be rebuilt on every deploy.
            npm -w @singularity/shared-types run build || true
            npm -w @singularity/shared-api run build || true

            cd apps/api
            # tsc OOMs at the V8 default (~1.5 GB) on this codebase.
            # The droplet has 2 GB RAM + 2 GB swap, so we can safely
            # give tsc a 2 GB heap and let the OS page to swap as
            # needed. Skip declarations + sourcemaps via CLI flags to
            # further reduce memory pressure (API is not consumed as a
            # library so .d.ts files aren't needed in prod).
            NODE_OPTIONS="--max-old-space-size=2048" npx tsc --declaration false --declarationMap false --sourceMap false
            echo "Checking dist/routes/admin.js exists:"
            ls -la dist/routes/admin.js 2>/dev/null || echo "ERROR: admin.js not found in dist!"

            # Start API fresh
            pm2 start /var/www/singularity/apps/api/ecosystem.config.js --update-env
            sleep 5
            echo "PM2 processes after restart:"
            pm2 list
            echo "API test response:"
            curl -s http://localhost:3002/api/v1 | head -c 500 || echo "API not responding"
            echo "=== pm2 logs (last 30 lines) ==="
            pm2 logs singularity-api --nostream --lines 30 2>&1 || true
            pm2 save
            bash /var/www/singularity/apps/api/deploy/update-nginx.sh
            sudo nginx -t && sudo systemctl reload nginx
            echo "=== nginx config (server/location lines) ==="
            sudo grep -n 'server\|location\|listen\|proxy_pass\|server_name' /etc/nginx/sites-available/singularity 2>/dev/null || echo "config not found"
            echo "=== nginx test after all changes ==="
            sudo nginx -t 2>&1
            echo "=== verifying API via domain ==="
            curl -sS -o /dev/null -w "https domain API: HTTP %{http_code}\n" "https://singularity.boo/api/v1" || echo "curl failed"
            echo "API deployed at $(date)"
