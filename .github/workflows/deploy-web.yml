name: Deploy Web to Digital Ocean

on:
  push:
    branches:
      - master
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Digital Ocean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_WEB_HOST }}
          username: deploy
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            # Fail fast — earlier versions of this script ran the whole
            # pipeline even when npm install / next build failed, causing
            # pm2 to restart against a stale or broken .next while the
            # workflow reported "success". Anything non-zero should now
            # surface as a failed GitHub Action run.
            set -e

            cd /var/www/singularity

            # Ensure swap exists to prevent OOM during npm install
            if [ ! -f /swapfile ]; then
              echo "Creating 2GB swap file..."
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
            fi

            # Chown EVERYTHING under /var/www/singularity to the deploy user.
            # In the past, stray files (notably node_modules/@img/sharp-libvips-linux-x64,
            # which gets unpacked with different ownership by some npm runs)
            # caused `npm install` to abort with EACCES before any workspace
            # package could be rebuilt. Chowning the whole tree on every
            # deploy is cheap and guarantees the install + build steps can
            # always rewrite files.
            sudo chown -R deploy:deploy /var/www/singularity

            git fetch origin master
            git reset --hard origin/master

            # Clean .next build cache, all node_modules, AND the lockfile
            # before reinstalling. The lockfile removal is load-bearing:
            # https://github.com/npm/cli/issues/4828 — when a lockfile
            # was last generated on a different platform (macOS, in our
            # case), npm install on Linux silently prunes the platform-
            # specific optional deps (rollup / esbuild / swc native
            # binaries) even from a fully-clean node_modules. The rollup
            # team's own error message says the ONLY reliable fix is
            # removing BOTH package-lock.json and node_modules, then
            # letting npm regenerate the lockfile fresh on Linux. Prior
            # workarounds (clean node_modules only, explicit npm install
            # @rollup/rollup-linux-x64-gnu) kept uncovering the next
            # missing binary. This is the nuclear-but-actually-works
            # option. The regenerated lockfile is ephemeral to the
            # droplet and is not committed back to git.
            rm -rf apps/web/.next
            rm -rf node_modules apps/web/node_modules apps/api/node_modules \
                   packages/shared-api/node_modules packages/shared-types/node_modules
            rm -f package-lock.json

            # Limit Node memory during install to prevent OOM. 2GB swap
            # should cover the clean install + build.
            NODE_OPTIONS="--max-old-space-size=768" npm install

            # Rebuild workspace packages BEFORE building the web app.
            # apps/web imports from @singularity/shared-api via its dist/
            # output — `npm install` does NOT run their build scripts, so
            # without this step any change to packages/shared-api/src is
            # invisible to apps/web and produces confusing type errors
            # against stale declaration files.
            npm -w @singularity/shared-types run build || true
            npm -w @singularity/shared-api run build

            cd apps/web
            npm run build

            # Ensure nginx (running as www-data) can read the newly
            # built static assets. Without this, `/_next/static/chunks/*`
            # requests can return 500s because nginx hits a permission
            # error reading the file produced by the deploy user.
            chmod -R a+rX .next

            # Debug: verify the chunks referenced by the built HTML
            # actually exist on disk. Prior runs showed disk chunks with
            # unusual "0-xxx~yyy" names while SSR HTML referenced plain
            # hex hashes — we want to know whether those are different
            # chunk tiers inside the same build or genuinely missing
            # files.
            echo "=== .next/static/chunks/ file count ==="
            ls -1 .next/static/chunks/ 2>&1 | wc -l
            echo "=== .next/static/chunks/ first 10 ==="
            ls -1 .next/static/chunks/ 2>&1 | head -10
            echo "=== chunks referenced by built /login HTML ==="
            HTML_FILE=$(find .next/server/app -name 'login*.html' 2>/dev/null | head -1)
            echo "HTML file: $HTML_FILE"
            if [ -n "$HTML_FILE" ]; then
              grep -oE 'chunks/[a-zA-Z0-9~_.-]+\.(js|css)' "$HTML_FILE" | sort -u | head -20
              echo "=== existence check ==="
              for f in $(grep -oE 'chunks/[a-zA-Z0-9~_.-]+\.(js|css)' "$HTML_FILE" | sort -u | head -5); do
                if [ -f ".next/static/$f" ]; then
                  echo "OK    $f"
                else
                  echo "MISS  $f"
                fi
              done
            fi
            echo "=== running processes on port 3000 ==="
            sudo lsof -iTCP:3000 -sTCP:LISTEN 2>&1 || echo "(lsof output above)"
            echo "=== all node processes ==="
            ps aux | grep -E '[n]ode|[n]ext|[p]m2' | head -20
            echo "=== .next/ size ==="
            du -sh .next/ 2>&1

            # Restart the web process cleanly.
            #
            # Previous debug runs found a ROOT-owned `next-server
            # (v16.1.1)` process that had been running since Apr 7,
            # serving stale cached HTML (referencing chunk hashes that
            # no longer exist on disk) while our pm2-managed process
            # ran alongside. pm2 cannot delete or restart a root-owned
            # orphan, so we need to explicitly kill ALL lingering
            # next-server processes with sudo before starting ours.
            # We also free port 3000 via fuser as a belt-and-suspenders
            # check.
            pm2 delete singularity-web || true
            # Kill any orphan next-server on port 3000. We used to run
            # `sudo pm2 kill` but that also took down root's pm2 daemon
            # which manages the API server — causing a full API outage.
            # Instead, surgically kill only processes listening on 3000.
            sudo fuser -k 3000/tcp 2>/dev/null || true
            sleep 3

            # Confirm port 3000 is free before starting; fail loudly
            # otherwise so we don't ship against an orphan binding.
            if sudo lsof -iTCP:3000 -sTCP:LISTEN 2>/dev/null | grep -q LISTEN; then
              echo "ERROR: something is still listening on port 3000 after kill attempts"
              sudo lsof -iTCP:3000 -sTCP:LISTEN
              exit 1
            fi

            pm2 start /var/www/singularity/apps/web/ecosystem.config.js
            pm2 save

            # Wait briefly, then verify the new process is actually
            # bound to port 3000 and responding.
            sleep 5
            echo "=== post-start pm2 list ==="
            pm2 list
            echo "=== post-start port 3000 ==="
            sudo lsof -iTCP:3000 -sTCP:LISTEN 2>&1 || true
            echo "=== post-start all node processes ==="
            ps aux | grep -E '[n]ode|[n]ext|[p]m2' | head -20

            echo "Deployed at $(date)"
