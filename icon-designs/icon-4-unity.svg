  <path d="M170 100 A70 70 0 0 1 100 170" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 170 A70 70 0 0 1 30 100" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <path d="M30 100 A70 70 0 0 1 100 30" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <!-- Inner unity -->
  <circle cx="100" cy="100" r="25" fill="none" stroke="#10B981" stroke-width="4"/>
  <circle cx="100" cy="100" r="6" fill="#10B981"/>
</svg>
